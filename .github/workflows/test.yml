name: Laika Shield Test Suite

on:
  push:
    branches:
      - beta
      - main

  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: xdebug

      - name: Validate composer.json
        run: composer validate --strict

      # Parses every file with the matrix version's own parser.
      - name: Lint PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -n1 -- php -l

      # --prefer-dist pulls zipballs from api.github.com and disables source
      # fallback, so a single TLS/network hiccup fails the whole job. Retry
      # over git, which uses the system CA store instead of PHP's curl.
      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress \
            || composer install --prefer-source --no-progress

      # Catches what the parser cannot: functions removed or deprecated in a
      # later version, signatures that changed, behaviour flagged for removal.
      - name: PHPCompatibility check (8.1-8.5)
        run: vendor/bin/phpcs --standard=phpcs.xml --report=full

      - name: Run tests
        run: vendor/bin/phpunit --colors=always --display-warnings --display-deprecations --display-notices

      - name: Run PHPUnit with coverage
        if: matrix.php == '8.3'
        run: vendor/bin/phpunit --coverage-text

      - name: Report result
        if: success()
        run: echo "### PHP ${{ matrix.php }} ✅ compatible" >> $GITHUB_STEP_SUMMARY

      - name: Report result (failed)
        if: failure()
        run: echo "### PHP ${{ matrix.php }} ❌ failed" >> $GITHUB_STEP_SUMMARY
